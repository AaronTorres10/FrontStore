<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front End Store</title>
    <link rel="stylesheet" href="styles/normalize.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header class="header">
        <a href="index.html">
            <img class="header__logo" src="img/logo.png" alt="Logotipo de Front End Store">
        </a>
    </header>
    <nav class="navigation">
    <a class="navigation__link navigation__link--asset" href="index.html">Tienda</a>
    <a class="navigation__link" href="nosotros.html">Nosotros</a>
    </nav>

    <main class="container">
        <h1>ReactJs</h1>
        <div class="shirt">
            <img class="shirt__image" src="img/3.jpg" alt="shirtReactJS">

            <div class="shirt__content">
                <p>Playera inspirada en Vue.js, perfecta para desarrolladores que disfrutan crear interfaces modernas, rápidas y dinámicas.</p>
                <form class="form">
                    <select class="form__field">
                        <option disabled selected>Seleccionar Talla</option>
                        <option>Chica</option>
                        <option>Mediana</option>
                        <option>Grande</option>
                        <option>Extra Grande</option>
                    </select>
                    <input class="form__field" type="number" placeholder="Cantidad" min="1">
                    <input class="form__submit" type="submit" value="Agregar al Carrito">
                </form>
            </div>
        </div>

    </main>

    <footer class="footer">
        <p class="footer__text">Front-End Store - Todos lod derechos reservados 2026.</p>
    </footer>
</body>
</html>
